[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-agent"
version = "0.2.1"
description = "Self-evolving, protocol-safe research agent for TDC ADMET leaderboards"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyTDC>=0.4.1",
  "rdkit>=2023.9.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
strong = ["catboost>=1.2.7"]
boosters = ["xgboost-cpu>=2.1,<4", "lightgbm>=4.5,<5"]
search = ["optuna>=4,<5"]
ranking = [
  "catboost>=1.2.7",
  "xgboost-cpu>=2.1,<4",
  "lightgbm>=4.5,<5",
  "optuna>=4,<5",
]
gpu = ["xgboost>=2.1,<4"]
openai = ["openai>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
admet-agent = "admet_agent.cli:main"

[tool.setuptools.packages.find]
include = ["admet_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
