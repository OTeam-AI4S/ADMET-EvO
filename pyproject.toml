[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-agent"
version = "0.3.0"
description = "ADMET-EvO: an evolutionary, protocol-safe research agent for TDC ADMET leaderboards"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yilin Wang" }]
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyTDC>=0.4.1",
  "rdkit>=2023.9.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
strong = ["catboost>=1.2.7"]
boosters = ["xgboost-cpu>=2.1,<4", "lightgbm>=4.5,<5"]
search = ["optuna>=4,<5"]
ranking = [
  "catboost>=1.2.7",
  "xgboost-cpu>=2.1,<4",
  "lightgbm>=4.5,<5",
  "optuna>=4,<5",
]
gpu = ["xgboost>=2.1,<4"]
openai = ["openai>=2.0"]
unimol = ["unimol-tools>=0.1.2,<0.2"]
minimol = ["minimol==1.3.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
admet-agent = "admet_agent.cli:main"

[project.urls]
Homepage = "https://github.com/OTeam-AI4S/ADMET-EvO"
Documentation = "https://github.com/OTeam-AI4S/ADMET-EvO/blob/main/MANUSCRIPT.md"
Repository = "https://github.com/OTeam-AI4S/ADMET-EvO"

[tool.setuptools.packages.find]
include = ["admet_agent*", "skills", "skills.dataskill*"]

[tool.setuptools.package-data]
"skills.dataskill" = [
  "SKILL.md",
  "agents/*.yaml",
  "references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Keep CI focused on syntax errors, undefined names, and invalid control flow.
# The historical experiment scripts intentionally bootstrap sys.path and retain
# frozen formatting, so broad style enforcement is introduced incrementally.
select = ["E9", "F63", "F7", "F82"]
